[project]
name = "no-meta-authority-runtime"
version = "0.1.0"
description = "Fail-closed AI agent authorization runtime for seed-mediated authority migration and staged declared autonomy."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "no-meta-authority-runtime contributors" }]
keywords = [
  "ai-agents",
  "authorization",
  "runtime-assurance",
  "canonical-json",
  "append-only-ledger",
  "authority-accounting",
  "auditability",
  "autonomy",
  "rlhf",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/no-meta-authority-runtime/no-meta-authority-runtime"
Issues = "https://github.com/no-meta-authority-runtime/no-meta-authority-runtime/issues"

[project.scripts]
no-meta-seed = "no_meta_authority_runtime.seed.cli:main"
no-meta-runtime = "no_meta_authority_runtime.cli.main:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
